# CI for the template itself, not for a project generated from it — a generated
# project brings its own .github/workflows/ci.yml.
#
# Nothing here is templated: this directory sits outside
# `{{ cookiecutter.project_slug }}`, so cookiecutter never renders it. GitHub's
# ${{ }} expressions are therefore safe to use directly.
name: Template

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The combination list lives in scripts/check-matrix.sh. Reading it here keeps
  # adding a combination a one-line change to the script.
  combos:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.list.outputs.names }}
      test_names: ${{ steps.list.outputs.test_names }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          echo "names=$(./scripts/check-matrix.sh --list)" >> "$GITHUB_OUTPUT"
          echo "test_names=$(./scripts/check-matrix.sh --list-tests)" >> "$GITHUB_OUTPUT"

  generate:
    needs: combos
    runs-on: ubuntu-24.04
    strategy:
      # One red check naming the combination that broke beats one job whose log
      # has to be read to find out.
      fail-fast: false
      matrix:
        combo: ${{ fromJson(needs.combos.outputs.names) }}
    name: generate (${{ matrix.combo }})
    steps:
      - uses: actions/checkout@v4

      # setup-go's go-version-file cannot be used: this repo's only go.mod is a
      # Jinja template whose module line is an expression. The `go` directive
      # itself carries no Jinja, so read that one line instead of duplicating
      # the version here.
      - id: goversion
        run: |
          version=$(grep -m1 '^go ' '{{ cookiecutter.project_slug }}/go.mod' | awk '{print $2}')
          # A pull request can edit that go.mod, and this value reaches a cache
          # key and an action input, so accept only a version and nothing else.
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) echo "unexpected go directive: '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          # The template ships no go.sum, so there is no lockfile for setup-go
          # to key a cache on. The module cache is handled below instead.
          cache: false

      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gomod-${{ runner.os }}-${{ steps.goversion.outputs.version }}-${{ hashFiles('**/go.mod') }}
          restore-keys: gomod-${{ runner.os }}-${{ steps.goversion.outputs.version }}-

      - uses: astral-sh/setup-uv@v7

      # `task init` shells out to these. templ is deliberately absent: the
      # generated project resolves it through its own tool directive with
      # `go tool templ`, which is why init runs `go mod tidy` first.
      - name: Install task and sqlc
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      # A standalone binary rather than a Go tool, and only some combinations
      # use it — but installing it unconditionally keeps the matrix uniform and
      # costs one download.
      - name: Install tailwindcss
        run: |
          curl -fsSL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          tailwindcss --help >/dev/null

      # Through env rather than interpolated into the command: the value is
      # repo-controlled today, but a matrix value spliced into a shell line is
      # the shape of an injection and not worth keeping around.
      - name: Generate, init and build
        env:
          COMBO: ${{ matrix.combo }}
        run: ./scripts/check-matrix.sh "$COMBO"

  # Building a project proves it compiles, which says nothing about what it
  # does. These run the generated project's own suite: trace_id propagation,
  # CSRF actually refusing a cross-origin post, and the embedded-Postgres
  # guards against adopting another project's database.
  #
  # Postgres combinations only — internal/server and internal/store are
  # Postgres-only in the template, so a SQLite project's suite covers little
  # the others do not.
  test:
    needs: combos
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJson(needs.combos.outputs.test_names) }}
    name: test (${{ matrix.combo }})
    steps:
      - uses: actions/checkout@v4

      - id: goversion
        run: |
          version=$(grep -m1 '^go ' '{{ cookiecutter.project_slug }}/go.mod' | awk '{print $2}')
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) echo "unexpected go directive: '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: false

      - name: Cache Go modules and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gomod-${{ runner.os }}-${{ steps.goversion.outputs.version }}-${{ hashFiles('**/go.mod') }}
          restore-keys: gomod-${{ runner.os }}-${{ steps.goversion.outputs.version }}-

      # Postgres is downloaded and extracted on first use, then reused. Without
      # this every job pays for the download again.
      - name: Cache embedded Postgres
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-v16

      - uses: astral-sh/setup-uv@v7

      - name: Install task and sqlc
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Install tailwindcss
        run: |
          curl -fsSL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss

      # -race only where it is worth the wall clock: on the branch that ships.
      - name: Generate and test
        env:
          COMBO: ${{ matrix.combo }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_TESTS: "1"
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            GO_TEST_FLAGS=-race ./scripts/check-matrix.sh "$COMBO"
          else
            ./scripts/check-matrix.sh "$COMBO"
          fi

  # A branch protection rule can require this one check instead of naming every
  # combination, so adding a combination does not need the rule updated.
  matrix-passed:
    if: always()
    needs: [generate, test]
    runs-on: ubuntu-24.04
    steps:
      - env:
          GENERATE: ${{ needs.generate.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "generate: $GENERATE"
          echo "test:     $TEST"
          if [ "$GENERATE" != "success" ] || [ "$TEST" != "success" ]; then
            exit 1
          fi
