{% raw %}# Lives beside the migrations it reads as its schema, so `task sqlc` runs from
# this directory.
version: "2"
sql:
  - schema: ./migrations/
{% endraw %}    engine: {% if cookiecutter.database_choice == 'postgres' %}postgresql{% else %}sqlite{% endif %}
{% raw %}    queries: ../internal/store/queries/
    gen:
      go:
        package: store
        out: ../internal/store
        emit_json_tags: true
        emit_interface: false
        emit_exact_table_names: true
        emit_empty_slices: true
        emit_params_struct_pointers: false
{% endraw %}{% if cookiecutter.database_choice == 'postgres' %}        sql_package: pgx/v5
{% endif %}
