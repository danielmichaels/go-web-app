# This file is copied verbatim by cookiecutter (see _copy_without_render):
# GitHub Actions expressions use ${{ }}, which Jinja would try to evaluate.
# So nothing here is templated — the Go version comes from go.mod, the module
# path from `go list -m`, and the image name from the repository itself.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Present only when the project was generated with a UI, so this is
      # guarded rather than conditional on a template flag.
      - name: Generate templ
        run: |
          if ls internal/ui/templates/*.templ >/dev/null 2>&1; then
            go tool templ generate
          fi

      - run: go build ./...
      - run: go vet ./...

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate templ
        run: |
          if ls internal/ui/templates/*.templ >/dev/null 2>&1; then
            go tool templ generate
          fi

      # Pinned to the release .woodpecker.yml runs, so the two CI choices
      # cannot disagree about whether this code passes.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./... --config=.golangci.yml

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Postgres is downloaded and extracted on first use, then reused. Without
      # this every job pays for the download again.
      - name: Cache embedded Postgres
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-v16

      - name: Generate templ
        run: |
          if ls internal/ui/templates/*.templ >/dev/null 2>&1; then
            go tool templ generate
          fi

      # -race only where it is worth the wall clock: on the branch that ships.
      - name: Test
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            go test -race ./...
          else
            go test ./...
          fi

  image:
    needs: [check, lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the version from git, so the history has to be here.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One native runner per architecture rather than QEMU emulation on one
      # runner: a cross-compiled Go build under QEMU is many times slower.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p /tmp/digests
          echo "$DIGEST" > "/tmp/digests/$(echo "$PLATFORM" | tr '/' '-')"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  image-merge:
    needs: [image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch manifest
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Combines the per-architecture digests into one manifest list, so
      # `docker pull` picks the right image for the host.
      - name: Create manifest list
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for f in /tmp/digests/*; do echo "${IMAGE_NAME}@$(cat "$f")"; done)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"
