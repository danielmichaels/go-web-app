{% raw %}version: '3'

dotenv:
  - .env

vars:
{% endraw %}  APP_NAME: {{ '-'.join(cookiecutter['project_name'].lower().split()).replace('_', '-') }}
  CMD_NAME: {{ cookiecutter.cmd_name.strip() }}
{% if cookiecutter.database_choice == 'postgres' %}  DB_TYPE: postgres
  # Matches what internal/cmd starts for `task dev`, so the goose CLI tasks
  # below talk to the same embedded instance the app is using.
  DEV_DSN: postgres://postgres:postgres@localhost:5433/{{ cookiecutter.project_slug }}?sslmode=disable
{% raw %}  GOOSE_DSN: '{{.DATABASE_URL | default .DEV_DSN}}'
  PG_DIR: '{{.EMBEDDED_POSTGRES_DIR | default "./.data/postgres"}}'
{% endraw %}{% else %}  DB_TYPE: sqlite3
  DEV_DSN: ./database/data.db
{% raw %}  GOOSE_DSN: '{{.DATABASE_URL | default .DEV_DSN}}'
{% endraw %}{% endif %}
{% raw %}tasks:
  default:
    desc: display all available tasks
    cmds:
      - task --list-all
    silent: true

  init:
    desc: Generate code and tidy modules. Run this once after generating the project.
    cmds:
      # tidy first: `go tool templ` resolves the generator through the module
      # graph, and the template ships no go.sum. The trailing tidy then picks up
      # what only generated code imports.
      - task: tidy
{% endraw %}{% if not cookiecutter.api_only %}      - task: templ
{% endif %}{% if cookiecutter.use_tailwind and not cookiecutter.api_only %}      - task: css
{% endif %}{% raw %}      - task: sqlc
      - task: tidy

  tidy:
    desc: runs go mod tidy
    cmds:
      - go mod tidy

  dev:
    desc: Run the app with hot reload. No database needed{% endraw %}{% if cookiecutter.database_choice == 'postgres' %} — Postgres runs embedded{% endif %}.
{% if cookiecutter.database_choice == 'postgres' %}    env:
      EMBEDDED_POSTGRES: true
{% endif %}{% raw %}    cmds:
      - air -c .air.toml {{.CLI_ARGS}}

  test:
    desc: Run all tests{% endraw %}{% if cookiecutter.database_choice == 'postgres' %} (embedded Postgres starts automatically; no local DB, no Docker){% endif %}
{% raw %}    cmds:
      - go test ./... {{.CLI_ARGS}}

  sqlc:
    desc: Generate models using sqlc
    dir: assets
    cmds:
      - sqlc generate
{% endraw %}
{%- if not cookiecutter.api_only %}
{% raw %}  templ:
    desc: Generate Go code from .templ files
    cmds:
      - go tool templ generate {{.CLI_ARGS}}
{% endraw %}
{%- endif %}
{%- if cookiecutter.use_tailwind and not cookiecutter.api_only %}
{% raw %}  css:
    desc: Compile Tailwind CSS into the embedded static tree
    preconditions:
      # Without this the output file is never written, the layout's stylesheet
      # link 404s, and every page renders with no styling at all.
      - sh: command -v tailwindcss
        msg: |
          tailwindcss not found on PATH. It is a standalone binary, not a Go
          tool: https://tailwindcss.com/blog/standalone-cli
    cmds:
      - tailwindcss -i ./assets/css/input.css -o ./assets/static/css/main.css --minify

  css:watch:
    desc: Recompile Tailwind CSS on change
    cmds:
      - tailwindcss -i ./assets/css/input.css -o ./assets/static/css/main.css --watch
{% endraw %}
{%- endif %}
{%- if cookiecutter.database_choice == 'postgres' %}
{% raw %}  clean:pg:
    desc: 'Remove embedded-Postgres temp dirs left by killed test runs. Dirs whose postmaster is still alive are reported, not touched — run `task clean:pg FORCE=1` to stop those too.'
    cmds:
      # Deliberately /bin/sh, not Task's built-in shell: the `kill -0`
      # liveness guard does not behave the same there, and getting it wrong
      # deletes the data directory of a running instance.
      - sh scripts/clean-pg.sh

  clean:
    desc: 'Delete the dev database and build output so the next `task dev` migrates a fresh one. Stop `task dev` first.'
    cmds:
      - |
        case "{{.PG_DIR}}" in
          ""|/|.|./|..|../) echo "refusing to remove '{{.PG_DIR}}'" >&2; exit 1 ;;
        esac
        rm -rf "{{.PG_DIR}}" ./.data/runtime bin tmp/main
        echo "removed {{.PG_DIR}}, bin/ and tmp/main"
{% endraw %}
{%- else %}
{% raw %}  clean:
    desc: 'Delete the local database and build output so the next `task dev` migrates a fresh one.'
    cmds:
      - rm -f ./database/data.db ./database/data.db-wal ./database/data.db-shm
      - rm -rf bin tmp/main
{% endraw %}
{%- endif %}
{%- if cookiecutter.database_choice == 'postgres' or cookiecutter.use_nats %}
{% raw %}  compose:up:
    desc: 'Start the optional supporting services (see compose.yaml). Not needed for `task dev`.'
    cmds:
      - docker compose up --wait -d {{.CLI_ARGS}}

  compose:down:
    desc: Stop the supporting services
    cmds:
      - docker compose down {{.CLI_ARGS}}

  compose:*:*:
    desc: 'Passthrough, e.g. `task compose:logs:db`'
    vars:
      CMD: "{{index .MATCH 0}}"
      SVC: "{{index .MATCH 1}}"
    cmds:
      - docker compose {{.CMD}} {{.SVC}} {{.CLI_ARGS}}
{% endraw %}
{%- endif %}
{% raw %}  # The app applies migrations itself at boot, so these are dev conveniences:
  # creating a migration, inspecting status, and stepping back down.
  db:migration:up:
    desc: Run migrations (all of them)
    cmds:
      - goose -dir ./assets/migrations {{.DB_TYPE}} "{{.GOOSE_DSN}}" up

  db:migration:down:
    desc: Roll back the most recent migration
    cmds:
      - goose -dir ./assets/migrations {{.DB_TYPE}} "{{.GOOSE_DSN}}" down

  db:migration:down:to:
    desc: Run migrations back to a specific version
    summary: |
      Rollback to a specific version of the local migrations. Must provide the version
      as an argument.
      Example,
      task db:migration:down:to -- 0001
    cmds:
      - goose -dir ./assets/migrations {{.DB_TYPE}} "{{.GOOSE_DSN}}" down-to {{.CLI_ARGS}}

  db:migration:create:
    desc: Create a new migration. The migration name is the value after --
    summary: |
      Create a new migrations file using the following syntax
      task db:migration:create -- my-new-migration
    cmds:
      - goose -dir ./assets/migrations {{.DB_TYPE}} "{{.GOOSE_DSN}}" create {{.CLI_ARGS}} sql
      - goose -dir ./assets/migrations {{.DB_TYPE}} "{{.GOOSE_DSN}}" fix

  db:migration:redo:
    desc: Roll back the latest migration, then reapply it
    cmds:
      - goose -dir ./assets/migrations {{.DB_TYPE}} "{{.GOOSE_DSN}}" redo

  db:migration:status:
    desc: Show which migrations have been applied
    cmds:
      - goose -dir ./assets/migrations {{.DB_TYPE}} "{{.GOOSE_DSN}}" status

  audit:
    desc: Run linters and formatters
    cmds:
      - task: golines
      - task: golangci

  golangci:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./... -c .golangci.yml {{.CLI_ARGS}}

  golines:
    desc: run golines
    cmds:
      - golines . -w --ignore-generated --no-reformat-tags --ignored-dirs=ci --base-formatter=gofumpt {{.CLI_ARGS}}

  golines-ci:
    desc: run golines in dry-run mode, failing if anything would change
    cmds:
      - |
        output=$(golines . --ignore-generated --no-reformat-tags --ignored-dirs=ci --base-formatter=gofumpt --dry-run)
        if [ -n "$output" ]; then
          echo "$output"
          exit 1
        fi

  install_bins:
    desc: Install the external tools these tasks call
    cmds:
      - go install github.com/pressly/goose/v3/cmd/goose@latest
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - go install github.com/air-verse/air@latest
      - go install github.com/go-task/task/v3/cmd/task@latest
      - go install github.com/segmentio/golines@latest
      - go install mvdan.cc/gofumpt@latest
      - go install github.com/danielgtaylor/restish@latest
{% endraw %}{% if cookiecutter.use_tailwind and not cookiecutter.api_only %}      # tailwindcss is a standalone binary, not a Go tool:
      # https://tailwindcss.com/blog/standalone-cli
{% endif %}