# Local development only: hot-reloads the server on change.
root = "."
tmp_dir = "tmp"

[build]
bin = "./tmp/main"
args_bin = ["serve"]
{% if cookiecutter.api_only -%}
cmd = "go build -o ./tmp/main ./cmd/{{ cookiecutter.cmd_name.strip() }}"
{% elif cookiecutter.use_tailwind -%}
cmd = "go tool templ generate && tailwindcss -i ./assets/css/input.css -o ./assets/static/css/main.css && go build -o ./tmp/main ./cmd/{{ cookiecutter.cmd_name.strip() }}"
{% else -%}
cmd = "go tool templ generate && go build -o ./tmp/main ./cmd/{{ cookiecutter.cmd_name.strip() }}"
{% endif -%}
delay = 1000
{% if cookiecutter.database_choice == 'postgres' -%}
# .data holds the dev Postgres cluster; it changes constantly and must never
# trigger a rebuild.
exclude_dir = ["node_modules", "tmp", "vendor", ".data", "bin", "dist", "docs"]
{% else -%}
exclude_dir = ["node_modules", "tmp", "vendor", "database", "bin", "dist", "docs"]
{% endif -%}
exclude_file = []
{% if cookiecutter.api_only -%}
exclude_regex = ["_test\\.go$"]
{% else -%}
# _templ.go is generated by the build command above, so watching it would make
# every rebuild trigger another one.
exclude_regex = ["_test\\.go$", "_templ\\.go$"]
{% endif -%}
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = []
{% if cookiecutter.api_only -%}
include_ext = ["go", "sql"]
{% else -%}
include_ext = ["go", "templ", "sql", "css", "js", "html"]
{% endif -%}
kill_delay = "2s"
log = "build-errors.log"
# The embedded Postgres child process needs a signal to shut down cleanly;
# without this air SIGKILLs the app and leaves an orphaned postmaster behind.
send_interrupt = true
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = false
