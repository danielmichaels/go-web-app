{% raw %}
levels:
  - interval: "${LITESTREAM_L1_INTERVAL}"
  - interval: "${LITESTREAM_L2_INTERVAL}"
  - interval: "${LITESTREAM_L3_INTERVAL}"

snapshot:
  interval: "${LITESTREAM_SNAPSHOT_INTERVAL}"
  retention: "${LITESTREAM_SNAPSHOT_RETENTION}"

l0-retention: "${LITESTREAM_L0_RETENTION}"
l0-retention-check-interval: "${LITESTREAM_L0_RETENTION_CHECK}"

# LITESTREAM_LOCAL_DB_PATH must match the value in .env and the path the
# entrypoint restores to.
dbs:
  - path: "${LITESTREAM_LOCAL_DB_PATH}"
    replicas:
      - url: "${S3_DB_URL}"
        access-key-id: "${S3_ACCESS_KEY}"
        secret-access-key: "${S3_SECRET_KEY}"
        sync-interval: "${DB_SYNC_INTERVAL}"
{% endraw %}
