{% raw %}
# LITESTREAM_LOCAL_DB_PATH must match the value in .env and the path the
# entrypoint restores to.
dbs:
  - path: "${LITESTREAM_LOCAL_DB_PATH}"
    replicas:
      - url: "${S3_DB_URL}"
        access-key-id: "${S3_ACCESS_KEY}"
        secret-access-key: "${S3_SECRET_KEY}"
        sync-interval: "${DB_SYNC_INTERVAL}"
{% endraw %}
